name: Deploy Reviewed Site
on:
  workflow_run:
    workflows: [Verify Publisher]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_ci_run_id:
        description: Successful current-main CI run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: reviewed-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-deployment-proof.yml@e205849fa00bfcafb83b1bc645ae26e9ca378b47
    with:
      controller_ref: e205849fa00bfcafb83b1bc645ae26e9ca378b47
      completed_run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_ci_run_id || format('{0}', github.event.workflow_run.id) }}
  deploy:
    needs: verify
    if: needs.verify.outputs.verified_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install 'uv>=0.9,<1'
      - run: uv sync --frozen --no-dev
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm run build
      - run: uv run --frozen --no-dev python -m blogboard.run --verify-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blogboard/web
      - name: Confirm verified main is still current
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== process.env.VERIFIED_SHA) core.setFailed('Main changed; refusing stale deployment');
      - uses: actions/deploy-pages@v4
        id: deployment