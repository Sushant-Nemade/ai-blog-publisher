name: Verify Publisher
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'uv>=0.9,<1'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pip-audit --progress-spinner off
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: uv run --frozen python -m scripts.check_release
      - run: uv run --frozen python -m scripts.prepare_demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e