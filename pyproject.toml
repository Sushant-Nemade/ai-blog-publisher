[project]
name = "blogboard"
version = "0.2.0"
description = "Attributed BlogBoard derivative with private drafts and explicit reviewed publication"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.65,<2",
    "langchain-core>=1.3.3,<2",
    "langchain-groq>=1.1.2,<2",
    "langgraph>=1.0.10,<2",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.33.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "pip-audit>=2.9,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
